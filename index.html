<script>
const choice=(text,answer,options,emoji='📘')=>({type:'choice',prompt:'Selecciona la respuesta correcta',text,answer,options,emoji});

const trans=(text,answer,alts=[],hint='Escribe una traducción natural, no necesariamente literal.')=>({type:'translate',prompt:'Traduce al inglés',text,answer,alternatives:alts,hint});

const lessons=[
{id:1,l:'A1',t:'Saludos',e:'👋',q:[choice('Hello','Hola',['Hola','Gracias','Adiós','Por favor'],'👋'),choice('Good morning','Buenos días',['Buenas noches','Buenos días','Hasta luego','Perdón'],'☀️'),choice('Thank you','Gracias',['Hola','Gracias','Bienvenido','Adiós'],'🙏'),fill('Good ___!','afternoon','También se acepta “evening”.',['evening']),trans('Nos vemos mañana.','See you tomorrow.',['I will see you tomorrow.'])]},
{id:2,l:'A1',t:'Presentarse',e:'🙂',q:[choice('My name is Thomas','Me llamo Thomas',['Tengo Thomas','Me llamo Thomas','Vivo con Thomas','Quiero Thomas'],'🪪'),choice('How are you?','¿Cómo estás?',['¿Dónde estás?','¿Cómo estás?','¿Quién eres?','¿Qué haces?'],'💬'),fill('I ___ from Colombia.','am','Usa el verbo “to be”.'),trans('Tengo dieciocho años.','I am eighteen years old.',['I am 18 years old.']),order('Vivo en Bogotá.','I live in Bogotá.',['Bogotá.','live','I','in'])]},
{id:3,l:'A2',t:'Rutinas',e:'⏰',q:[choice('I wake up early','Me despierto temprano',['Me acuesto tarde','Me despierto temprano','Trabajo temprano','Estudio de noche'],'⏰'),fill('She ___ every day.','studies','Con she, el verbo termina en -ies.'),trans('Normalmente desayuno a las siete.','I usually have breakfast at seven.',['I normally eat breakfast at seven.']),order('Él va al trabajo en autobús.','He goes to work by bus.',['bus.','to','He','work','goes','by']),listen('I exercise after I finish my classes.','Hace ejercicio después de terminar sus clases.',['Hace ejercicio antes de clase.','Hace ejercicio después de terminar sus clases.','No hace ejercicio.','Termina sus clases muy tarde.'])]},
{id:4,l:'A2',t:'Comida y compras',e:'🍎',q:[choice('How much is it?','¿Cuánto cuesta?',['¿Dónde queda?','¿Cuánto cuesta?','¿Qué desea?','¿Está abierto?'],'💵'),fill('I would ___ some water.','like','La expresión cortés es “I would like”.'),trans('¿Me trae la cuenta, por favor?','Could you bring me the bill, please?',['Can I have the bill, please?']),order('La tienda está abierta.','The store is open.',['open.','store','is','The']),listen('I would like a cup of coffee without sugar.','Quiere un café sin azúcar.',['Quiere té con azúcar.','Quiere un café sin azúcar.','Quiere agua.','Quiere pagar.'])]},
{id:5,l:'B1',t:'Viajes y experiencias',e:'✈️',q:[order('Aunque perdimos el vuelo, llegamos a tiempo.','Although we missed the flight, we arrived on time.',['arrived','Although','time.','the','we','flight,','missed','on','we']),fill('If the weather ___ better, we could visit the town.','were','Segundo condicional.'),listen('The train was delayed, so we changed our plans.','El tren se retrasó y cambiaron sus planes.',['El tren llegó temprano.','El tren se retrasó y cambiaron sus planes.','Perdieron el equipaje.','Cancelaron todo.']),trans('Si hubiéramos reservado antes, habría sido más barato.','If we had booked earlier, it would have been cheaper.',['If we had reserved earlier, it would have been cheaper.']),fill('We had to ___ off the trip.','put','“Put off” significa aplazar.') ]},
{id:6,l:'B1',t:'Opiniones',e:'💬',q:[trans('En mi opinión, las redes sociales pueden ser útiles.','In my opinion, social media can be useful.',['I think social media can be useful.']),order('Aunque entiendo tu punto de vista, no estoy de acuerdo.','Although I understand your point of view, I do not agree.',['agree.','Although','your','I','view,','understand','do','not','point','of','I']),fill('The plan is expensive; ___, it could save money.','however','Conector de contraste.',['nevertheless']),listen('I understand the benefits, but I am not convinced.','Comprende las ventajas, pero no está convencido.',['No comprende nada.','Comprende las ventajas, pero no está convencido.','Está totalmente de acuerdo.','No conoce la propuesta.']),trans('Depende de cómo se implemente la propuesta.','It depends on how the proposal is implemented.',['It depends on how the proposal is carried out.'])]},
{id:7,l:'B2',t:'Trabajo y estudios',e:'💼',q:[listen('I would appreciate it if you could send the report by Friday.','Solicita el informe antes del viernes.',['Cancela el informe.','Solicita el informe antes del viernes.','Aprueba el informe.','Pide una reunión.']),trans('A pesar del retraso, el equipo cumplió los objetivos.','Despite the delay, the team met the objectives.',['Despite the delay, the team achieved its goals.']),fill('A final decision must be ___.','made','La colocación es “make a decision”.'),order('Cuando termine el análisis, compartiré los resultados.','Once I finish the analysis, I will share the results.',['results.','Once','analysis,','share','finish','I','the','will','I']),fill('Do not hesitate to ___ me.','contact','Expresión profesional.',['email'])]},
{id:8,l:'B2',t:'Argumentación',e:'🗣️',q:[order('La evidencia sugiere que se necesita más investigación.','The evidence suggests that further research is needed.',['needed.','suggests','research','The','further','evidence','that','is']),trans('No solo reduce costos, sino que también mejora el servicio.','It not only reduces costs, but also improves the service.',['It is not only about reducing costs, but also about improving the service.']),listen('While the plan has advantages, I remain concerned about its impact.','Reconoce ventajas, pero mantiene una preocupación.',['Rechaza todo.','Apoya todo.','Reconoce ventajas, pero mantiene una preocupación.','No tiene opinión.']),fill('The measure may work; ___, its cost is concerning.','nevertheless','Conector de contraste.',['however','nonetheless']),trans('Sus efectos a largo plazo siguen siendo inciertos.','Its long-term effects remain uncertain.',['Its effects in the long term are still uncertain.'])]},
{id:9,l:'C1',t:'Comunicación avanzada',e:'🎓',q:[trans('Si bien los hallazgos son prometedores, no son concluyentes.','While the findings are promising, they are not conclusive.',['Although the findings are promising, they are not conclusive.']),fill('The policy was introduced to ___ these concerns.','address','“Address” puede significar abordar un problema.'),order('De no haberse aplicado, la situación habría empeorado.','Had it not been implemented, the situation would have deteriorated.',['deteriorated.','not','situation','implemented,','the','would','Had','been','it','have']),listen('The findings are by no means definitive, yet they are useful.','Los hallazgos no son definitivos, pero son útiles.',['Son definitivos.','Los hallazgos no son definitivos, pero son útiles.','No sirven.','Deben eliminarse.']),trans('La validez depende de la fiabilidad de los datos.','The validity depends on the reliability of the data.',['Validity depends on data reliability.'])]},
{id:10,l:'C1',t:'Análisis y fluidez',e:'🏆',q:[listen('The proposal is ambitious, but its feasibility remains open to question.','El hablante duda de su viabilidad.',['Ya fracasó.','El hablante duda de su viabilidad.','Es fácil.','No conoce la propuesta.']),trans('Lejos de resolver el problema, la decisión reveló fallas más profundas.','Far from solving the problem, the decision revealed deeper flaws.',['Far from resolving the problem, the decision exposed deeper shortcomings.']),fill('The evidence calls the conclusion into ___.','question','Expresión: “call into question”.'),order('Por convincente que parezca, pasa por alto problemas fundamentales.','However convincing it may seem, it overlooks fundamental problems.',['problems.','it','overlooks','However','may','convincing','fundamental','seem,','it']),fill('The report sheds ___ on the causes.','light','Expresión: “shed light on”.')]}
];
let state={},active=null,pending=null,current=null,qi=0,correct=0,answered=false,built=[];const $=x=>document.getElementById(x),levels=['A1','A2','B1','B2','C1'];
function profiles(){try{return JSON.parse(localStorage.getItem('egProfiles')||'{}')}catch{return{}}}function store(p){localStorage.setItem('egProfiles',JSON.stringify(p))}function hash(x){let h=0;for(const c of x)h=(h*31+c.charCodeAt())>>>0;return h.toString(16)}function save(){let p=profiles();if(active&&p[active]){p[active].state=state;store(p)}}
function gateView(id){['gateHome','profiles','login','create'].forEach(x=>$(x).classList.toggle('hide',x!==id))}function showCreate(){gateView('create')}function showProfiles(){gateView('profiles');let p=profiles();$('profileList').innerHTML=Object.keys(p).length?Object.entries(p).map(([id,v])=>`<button class="lesson" onclick="askPin('${id}')"><b>${safe(v.name)}</b><br><small>${v.age} · ${v.level} · ${v.state.xp||0} XP</small></button>`).join(''):'<p>No hay perfiles guardados.</p><button class="primary" onclick="showCreate()">Crear perfil</button>'}function safe(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function askPin(id){pending=id;$('loginTitle').textContent='PIN de '+profiles()[id].name;$('loginPin').value='';gateView('login')}function unlock(){let p=profiles()[pending];if(!p||hash($('loginPin').value)!==p.pin){$('loginError').textContent='PIN incorrecto';return}active=pending;state=p.state;$('gate').classList.add('hide');render()}
function createProfile(){let name=$('newName').value.trim(),pin=$('newPin').value,level=$('newLevel').value;if(name.length<2||!/^\d{4}$/.test(pin)){$('createError').textContent='Escribe un nombre y un PIN de 4 números.';return}let done=lessons.filter(x=>levels.indexOf(x.l)<levels.indexOf(level)).map(x=>x.id),id='p'+Date.now(),p=profiles();state={name,age:$('newAge').value,done,xp:0,hearts:5,streak:1};p[id]={name,age:state.age,level,pin:hash(pin),state};store(p);active=id;$('gate').classList.add('hide');render()}
function render(){let idx=Math.min(Math.floor(state.done.length/2),4),pct=Math.round(state.done.length/lessons.length*100);$('hello').textContent='¡Hola, '+state.name+'!';$('xp').textContent=state.xp;$('hearts').textContent=state.hearts;$('streak').textContent=state.streak;$('levelBadge').textContent=levels[idx];$('pct').textContent=pct;$('pbar').style.width=pct+'%';$('summary').textContent=state.done.length+' de '+lessons.length+' lecciones';$('levelTrack').innerHTML=levels.map((l,i)=>`<button class="${i===idx?'on':''}">${l}</button>`).join('');$('lessonList').innerHTML=lessons.map((l,i)=>{let d=state.done.includes(l.id),open=d||i<=state.done.length;return `<button class="lesson ${d?'done':open?'':'lock'}" ${open?`onclick="start(${l.id})"`:''}>${d?'✓':open?l.e:'🔒'} Lección ${i+1}: ${l.t} <span class="badge">${l.l}</span><br><small>5 actividades</small></button>`}).join('');save()}
function go(id){['home','quiz','profile'].forEach(x=>$(x).classList.toggle('hide',x!==id));$('nav').classList.toggle('hide',id==='quiz');if(id==='profile'){$('editName').value=state.name;$('editAge').value=state.age}}function start(id){current=lessons.find(x=>x.id===id);qi=0;correct=0;go('quiz');draw()}
function draw(){answered=false;built=[];$('feedback').className='feedback hide';$('check').classList.add('hide');$('work').innerHTML='';$('options').innerHTML='';$('listen').classList.add('hide');let q=current.q[qi];$('qbar').style.width=((qi+1)/5*100)+'%';$('qh').textContent=state.hearts;$('prompt').textContent=q.prompt;$('emoji').textContent=q.emoji||({fill:'✍️',translate:'🌍',order:'🧩',listen:'🎧'}[q.type]||'📘');$('question').textContent=q.text||q.es||'Escucha el audio';$('hint').textContent=q.hint||'';if(q.type==='choice'||q.type==='listen'){if(q.type==='listen')$('listen').classList.remove('hide');$('options').innerHTML=q.options.map(x=>`<button class="option" onclick='grade(${JSON.stringify(x)},this)'>${x}</button>`).join('')}else if(q.type==='fill'||q.type==='translate'){$('work').innerHTML='<input id="answer" class="input" placeholder="Escribe tu respuesta">';$('check').classList.remove('hide')}else{$('work').innerHTML=`<div id="sentence" class="sentence">Toca las palabras.</div><div class="chips">${q.words.map((w,i)=>`<button id="c${i}" class="option chip" onclick='add(${i},${JSON.stringify(w)})'>${w}</button>`).join('')}</div><button class="ghost" onclick="clearBuilt()">Borrar</button>`;$('check').classList.remove('hide')}}function add(i,w){$('c'+i).disabled=true;built.push({i,w});$('sentence').textContent=built.map(x=>x.w).join(' ')}function clearBuilt(){built.forEach(x=>$('c'+x.i).disabled=false);built=[];$('sentence').textContent='Toca las palabras.'}function checkOpen(){let q=current.q[qi],v=q.type==='order'?built.map(x=>x.w).join(' '):$('answer').value;if(!v.trim())return notify('Escribe una respuesta');grade(v)}
function norm(v){return String(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}function lev(a,b){let d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}function sim(a,b){a=norm(a);b=norm(b);let c=1-lev(a,b)/Math.max(a.length,b.length),A=new Set(a.split(' ')),B=new Set(b.split(' ')),common=[...A].filter(x=>B.has(x)).length,w=2*common/(A.size+B.size);return c*.65+w*.35}function evaluate(v,answers){let best={score:0,target:answers[0]};answers.forEach(a=>{let s=sim(v,a);if(s>best.score)best={score:s,target:a}});best.exact=norm(v)===norm(best.target);best.ok=best.exact||best.score>=(Math.min(norm(v).length,norm(best.target).length)<8?.82:.72);return best}
function grade(v,btn){if(answered)return;answered=true;let q=current.q[qi],answers=[q.answer,...(q.alternatives||[])],open=q.type==='fill'||q.type==='translate',e=open?evaluate(v,answers):{ok:answers.some(a=>norm(a)===norm(v)),exact:true,target:q.answer,score:1};document.querySelectorAll('.option').forEach(x=>x.disabled=true);$('check').classList.add('hide');if(e.ok){correct++;if(btn)btn.classList.add('correct');$('fbtitle').textContent=e.exact?'✅ ¡Correcto!':'✅ Respuesta aceptada';$('fbtext').textContent=!e.exact?(e.score>.9?'Está bien. Mejora mayúsculas y puntuación. Forma recomendada: ':'La idea es correcta, pero una estructura más natural sería: ')+e.target:'Muy bien estructurado.'}else{state.hearts=Math.max(0,state.hearts-1);if(btn)btn.classList.add('wrong');$('feedback').classList.add('bad');$('fbtitle').textContent='💪 Sigue practicando';$('fbtext').textContent='Una respuesta correcta sería: '+q.answer}$('feedback').classList.remove('hide');save()}
function next(){if(qi<4&&state.hearts>0){qi++;draw()}else{let earned=correct*10;if(correct>=3&&!state.done.includes(current.id))state.done.push(current.id);state.xp+=earned;if(!state.hearts)state.hearts=5;render();go('home');notify('Lección terminada: +'+earned+' XP')}}function exitQuiz(){if(confirm('¿Salir de la lección?'))go('home')}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)}}function saveProfile(){state.name=$('editName').value.trim()||state.name;state.age=$('editAge').value;let p=profiles();p[active].name=state.name;p[active].age=state.age;store(p);render();notify('Perfil actualizado')}function logout(){save();active=null;$('gate').classList.remove('hide');gateView('gateHome');go('home')}function notify(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}gateView('gateHome');
</script>
